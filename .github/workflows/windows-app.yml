name: Build Blackhole Timer for Windows

on:
  push:
    paths: ['windows-app/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json
      - run: npm ci
      # On Windows both the portable .exe and the installer can be built.
      - run: npm run dist:installer
      - uses: actions/upload-artifact@v4
        with:
          name: BlackholeTimer-windows
          path: windows-app/dist/*.exe
          retention-days: 30
