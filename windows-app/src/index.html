<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Blackhole Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Deep space: nebula and flying stars (and the black hole when time is up). -->
  <canvas id="stars" aria-hidden="true"></canvas>

  <div id="app">
    <header class="titlebar">
      <img src="../assets/icon.png" alt="" width="24" height="24">
      <span>Blackhole Timer</span>
    </header>

    <nav id="tabs" aria-label="Timers"></nav>

    <main id="hero">
      <!-- Setting the time -->
      <section id="setup" class="view">
        <canvas id="aurora" aria-hidden="true"></canvas>
        <div class="setup-content">
          <p class="eyebrow">SET TIMER</p>
          <div class="digits">
            <div class="digit" data-unit="h">
              <button class="step" data-step="1" aria-label="More hours"><svg><use href="#i-up"/></svg></button>
              <input inputmode="numeric" maxlength="2" aria-label="Hours">
              <button class="step" data-step="-1" aria-label="Fewer hours"><svg><use href="#i-down"/></svg></button>
              <span class="unit">HOURS</span>
            </div>
            <span class="colon">:</span>
            <div class="digit" data-unit="m">
              <button class="step" data-step="1" aria-label="More minutes"><svg><use href="#i-up"/></svg></button>
              <input inputmode="numeric" maxlength="2" aria-label="Minutes">
              <button class="step" data-step="-1" aria-label="Fewer minutes"><svg><use href="#i-down"/></svg></button>
              <span class="unit">MIN</span>
            </div>
            <span class="colon">:</span>
            <div class="digit" data-unit="s">
              <button class="step" data-step="1" aria-label="More seconds"><svg><use href="#i-up"/></svg></button>
              <input inputmode="numeric" maxlength="2" aria-label="Seconds">
              <button class="step" data-step="-1" aria-label="Fewer seconds"><svg><use href="#i-down"/></svg></button>
              <span class="unit">SEC</span>
            </div>
          </div>
          <div id="presets" class="chips"></div>
          <button id="start" class="capsule"><svg><use href="#i-play"/></svg>Start</button>
        </div>
      </section>

      <!-- Counting down -->
      <section id="running" class="view hidden">
        <div class="dial">
          <canvas id="eclipse" aria-hidden="true"></canvas>
          <div class="center" id="center-live">
            <p class="eyebrow" id="c-label">REMAINING</p>
            <p class="time"><span id="c-main">00:00</span><span id="c-tenths">.0</span></p>
            <p class="status"><svg><use id="c-status-icon" href="#i-bell"/></svg><span id="c-status"></span></p>
          </div>
          <div class="center hidden" id="center-done">
            <svg class="bell"><use href="#i-bell"/></svg>
            <p class="eyebrow bright">TIME'S UP</p>
          </div>
          <button id="silence" class="chip on hidden"><svg><use href="#i-bell-slash"/></svg>Silence reminder</button>
        </div>
        <div class="controls">
          <button id="cancel" class="glass-btn" title="Cancel (Esc)"><svg><use href="#i-x"/></svg></button>
          <button id="toggle" class="orb" title="Pause (Space)"><svg><use id="toggle-icon" href="#i-pause"/></svg></button>
          <button id="add" class="glass-btn" title="Add 1 minute">+1m</button>
        </div>
      </section>
    </main>

    <section id="settings" class="card">
      <div class="row">
        <span class="tile"><svg><use href="#i-tag"/></svg></span>
        <span class="title">Label</span>
        <input id="label" placeholder="Add label" maxlength="40">
        <span id="label-text" class="value hidden"></span>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="tile"><svg><use href="#i-bell"/></svg></span>
        <span class="title">Reminders</span>
        <span id="rem-summary" class="value small"></span>
        <button id="rem-switch" class="switch" role="switch" aria-label="Reminders"><span></span></button>
      </div>
      <div class="sub" id="rem-body">
        <div id="rem-chips" class="chips"></div>
        <label class="rings">
          <svg><use href="#i-wave"/></svg>Rings for
          <select id="rem-length"></select>
        </label>
      </div>
      <div class="divider"></div>
      <div class="row">
        <span class="tile"><svg><use href="#i-speaker"/></svg></span>
        <span class="title">Sound</span>
        <select id="sound"></select>
        <button id="preview" class="glass-btn small" title="Play this sound"><svg><use href="#i-play"/></svg></button>
      </div>
    </section>

    <button id="badge" class="badge" title="Open claude101.getworkdone.space">
      Powered by <b>Getworkdone</b>
      <span class="logo"><img src="../assets/getworkdone-logo.png" alt=""></span>
    </button>
  </div>

  <!-- Time's up -->
  <div id="alert" class="modal hidden" role="alertdialog" aria-labelledby="alert-title">
    <div class="sheet">
      <svg class="bell"><use href="#i-bell"/></svg>
      <h2 id="alert-title">Time's up!</h2>
      <p id="alert-text"></p>
      <div class="actions">
        <button id="alert-stop" class="capsule">Stop</button>
        <button id="alert-snooze" class="chip">Snooze 1 min</button>
        <button id="alert-restart" class="chip">Restart</button>
      </div>
    </div>
  </div>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.4 15.4A1 1 0 0 0 5.3 17h13.4a1 1 0 0 0 .9-1.6L18 12.6V9a6 6 0 0 0-6-6zm-2.5 15.5a2.5 2.5 0 0 0 5 0z" fill="currentColor"/></symbol>
    <symbol id="i-bell-slash" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.4 15.4A1 1 0 0 0 5.3 17h13.4a1 1 0 0 0 .9-1.6L18 12.6V9a6 6 0 0 0-6-6zm-2.5 15.5a2.5 2.5 0 0 0 5 0z" fill="currentColor"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.6V4.5a1 1 0 0 1 1-1h8.1a1 1 0 0 1 .7.3l7.2 7.2a1 1 0 0 1 0 1.4l-8.1 8.1a1 1 0 0 1-1.4 0l-7.2-7.2a1 1 0 0 1-.3-.7z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10.5v3M21 12h0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </svg>

  <script src="voices.js"></script>
  <script src="visuals.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
